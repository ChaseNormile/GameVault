spring.application.name=gamevault
# Import the shared local configuration when launched from backend/ or the repo root.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:gamevault}
spring.datasource.username=${POSTGRES_USER:gamevault}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
# Empty defaults keep the existing health endpoint usable without IGDB credentials.
igdb.client-id=${IGDB_CLIENT_ID:}
igdb.client-secret=${IGDB_CLIENT_SECRET:}
